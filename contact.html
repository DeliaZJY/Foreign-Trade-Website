<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Send Inquiry</title>
    <meta name="description" content="Contact us for price, sample, bulk order, customization details.">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
        header{background:#222;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;}
        .logo{font-size:22px;font-weight:bold;}
        nav a{color:#fff;text-decoration:none;margin:0 12px;}
        .title-bar{background:#eee;padding:30px 5%;text-align:center;}
        .wrap{max-width:900px;margin:40px auto;padding:0 5%;display:grid;grid-template-columns:1fr 1fr;gap:40px;}
        .info p{margin:14px 0;line-height:1.7;}
        form input,form textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:4px;font-size:15px;}
        button{padding:13px 30px;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px;}
        footer{background:#222;color:#aaa;text-align:center;padding:30px;margin-top:60px;font-size:14px;}
    </style>
</head>
<body>
    <header>
        <div class="logo">YOUR BRAND</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="title-bar">
        <h2>Contact Us & Send Inquiry</h2>
    </div>

    <div class="wrap">
        <div class="info">
            <h3>Contact Information</h3>
            <p>Email: delia@abiglazy.com</p>
            <p>WhatsApp: +86 15267217280</p>
            <p>Address: Hi-tech Zone, Ningbo/Zhejiang, China</p>
            <p>Business Hours: Mon-Sat 9:00-18:00</p>
        </div>

        <div>
            <form id="inquiryForm">
                <input type="text" name="name" placeholder="Your Full Name" required>
                <input type="email" name="email" placeholder="Your Email Address" required>
                <input type="text" name="company" placeholder="Company Name">
                <input type="tel" name="tel" placeholder="WhatsApp / Phone">
                <textarea name="message" rows="5" placeholder="Tell us your requirement: product, quantity, customization..."></textarea>
                <button type="submit">Submit Inquiry</button>
                <p id="msg" style="margin-top:10px;color:green;"></p>
            </form>
        </div>
    </div>

    <footer>
        © 2025-2026 YOUR BRAND. All rights reserved.
    </footer>

    <script>
        const form = document.getElementById('inquiryForm');
        const msgBox = document.getElementById('msg');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgBox.textContent = 'Sending...';
            const data = Object.fromEntries(new FormData(form));
            try {
                const res = await fetch('/api/inquiry', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(data)
                })
                const result = await res.json();
                if(result.success){
                    msgBox.textContent = 'Sent successfully! We will reply you soon.';
                    form.reset();
                }else{
                    msgBox.style.color = 'red';
                    msgBox.textContent = 'Failed, please try again later';
                }
            } catch(err){
                msgBox.style.color = 'red';
                msgBox.textContent = 'Network error';
            }
        })
    </script>
</body>
</html>
